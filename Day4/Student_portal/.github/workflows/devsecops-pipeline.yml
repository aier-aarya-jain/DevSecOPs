name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: 1 & 2. Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build with Maven
        run: mvn -B package --file backend/pom.xml
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Frontend Build
        run: |
          cd frontend
          npm install
          npm run build

  sast:
    name: 3. SAST (SonarQube & Semgrep)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
      # SonarQube would be configured here:
      # - name: SonarQube Scan
      #   uses: sonarsource/sonarqube-scan-action@master
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-scan:
    name: 4. Dependency Scan (Snyk & OWASP DC)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3
      - name: Snyk Monitor
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects

  secret-scan:
    name: 5. Secret Scan (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: 6. Docker Build
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, secret-scan]
    steps:
      - uses: actions/checkout@v3
      - name: Build Backend Image
        run: docker build -t student-portal-backend:latest ./backend
      - name: Build Frontend Image
        run: docker build -t student-portal-frontend:latest ./frontend

  container-scan:
    name: 7. Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v3
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'student-portal-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast:
    name: 8. DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - uses: actions/checkout@v3
      # Requires the application to be running or deployed to staging
      # - name: ZAP Scan
      #   uses: zaproxy/action-baseline@v0.7.0
      #   with:
      #     target: 'http://staging-environment.com'

  compliance:
    name: 9. Compliance Verification
    runs-on: ubuntu-latest
    needs: dast
    steps:
      - uses: actions/checkout@v3
      - name: Run compliance checks (e.g. InSpec or Checkov)
        run: echo "Simulating compliance verification (CIS, ASVS)"
        
  deploy:
    name: 10. Deployment
    runs-on: ubuntu-latest
    needs: compliance
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Production
        run: echo "Deploying to production environment"
